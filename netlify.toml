# Plain static site: no build step, Netlify serves the repo root as-is.
[build]
  publish = "."
  command = ""

# Serve the HTML exactly as written. Netlify's post-processing (Pretty URLs)
# rewrote attributes like style="url('Images/…')" into a broken form, so the
# photos never loaded.
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

# Dresses now live under Apparel; keep old links and bookmarks working.
[[redirects]]
  from = "/dresses.html"
  to = "/products.html?type=dresses"
  status = 301
